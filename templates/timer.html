<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Таймер — XYVERA</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap narrow"><a href="/" class="back">← XYVERA</a><p class="eyebrow">⏱️ ТАЙМЕР</p><h1>Таймер</h1><div id="time" class="timer big-timer">05:00</div><div class="timer-actions"><button class="button primary" onclick="start()">▶ Start</button><button class="button" onclick="pause()">⏸ Pause</button><button class="button" onclick="add(10)">+10 сек</button><button class="button" onclick="add(60)">+1 мин</button><button class="button" onclick="resetTimer()">Reset</button></div><p>OBS: <a id="overlayLink"></a></p></main><script>const id={{ timer_id|tojson }};async function api(path){const r=await fetch('/api/timer/'+id+path,{method:'POST'});return r.json()}async function load(){const r=await fetch('/api/timer/'+id);const t=await r.json();if(!r.ok){document.getElementById('time').textContent=t.error;return}document.getElementById('time').textContent=fmt(t.remaining);document.getElementById('overlayLink').href='/timer/'+id+'/overlay';document.getElementById('overlayLink').textContent=location.origin+'/timer/'+id+'/overlay'}function start(){api('/start').then(load)}function pause(){api('/pause').then(load)}function add(s){api('/add?seconds='+s).then(load)}function resetTimer(){api('/reset').then(load)}function fmt(s){s=Math.max(0,s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}load();setInterval(load,500)}</script></body></html>
