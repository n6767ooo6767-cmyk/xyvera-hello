<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль — XYVERA</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap narrow"><header><a class="back" href="/">← XYVERA</a><button class="button" onclick="logout()">Выйти</button></header><section class="panel"><p class="eyebrow">YOUR PROFILE</p><h1>Профиль</h1><label>Username<input id="username" placeholder="404kidyt"></label><label>Имя<input id="display_name" placeholder="404KidYT"></label><label>О себе<textarea id="bio" rows="4" placeholder="Расскажи немного о себе"></textarea></label><label>URL аватара<input id="avatar_url" placeholder="https://..."></label><button class="button primary" onclick="saveProfile()">Сохранить профиль</button><p id="message"></p><hr><h2>Ссылки</h2><div id="links"></div><button class="button" onclick="addLink()">＋ Добавить ссылку</button><p><a id="publicLink" href="#">Открыть публичный профиль →</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/static/auth.js"></script><script>loadProfile().then(u=>{if(u){loadLinks();document.getElementById('publicLink').onclick=async e=>{e.preventDefault();const {data}=await sb.from('profiles').select('username').eq('user_id',u.id).maybeSingle();if(data?.username)location.href='/u/'+encodeURIComponent(data.username);else msg('Сначала сохрани username.')}}});</script></body></html>
