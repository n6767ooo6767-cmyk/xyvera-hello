<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Опрос — XYVERA</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap narrow"><div id="poll"><p>Загрузка…</p></div></main><script>const pollId={{ poll_id|tojson }};const voter=localStorage.getItem('xyvera_voter')||crypto.randomUUID();localStorage.setItem('xyvera_voter',voter);async function load(){const r=await fetch('/api/poll/'+pollId);const p=await r.json();if(!r.ok){document.getElementById('poll').textContent=p.error||'Ошибка';return}const total=p.total||0;document.getElementById('poll').innerHTML='<a href="/" class="back">← XYVERA</a><p class="eyebrow">'+(p.mode==='timed'?'⏱️ С ТАЙМЕРОМ':p.mode==='vote'?'⚡ ГОЛОСОВАНИЕ':'🗳️ ОПРОС')+'</p><h1>'+esc(p.title)+'</h1>'+(p.mode==='timed'?'<div class="timer">'+fmt(p.remaining)+'</div>':'')+'<div class="vote-list">'+p.options.map(o=>'<button class="option" onclick="cast('+o.id+')"><span>'+esc(o.text)+'</span><strong>'+Math.round(total?o.votes/total*100:0)+'%</strong></button>').join('')+'</div><p>'+total+' голосов'+(p.closed?' · завершено':'')+'</p>'}async function cast(id){const r=await fetch('/api/poll/'+pollId+'/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({option_id:id,voter})});const d=await r.json();if(!r.ok){alert(d.error||'Ошибка');return}localStorage.setItem('xyvera_voted_'+pollId,'1');render(d)}function render(p){const total=p.total||0;document.getElementById('poll').querySelector('.vote-list').innerHTML=p.options.map(o=>'<div class="result-row"><span>'+esc(o.text)+'</span><span>'+o.votes+' · '+Math.round(total?o.votes/total*100:0)+'%</span></div>').join('')}function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}function fmt(s){s=Math.max(0,s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}load();setInterval(load,2000);</script></body></html>
