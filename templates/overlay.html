<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XYVERA Overlay</title><link rel="stylesheet" href="/static/style.css"></head><body class="overlay-body"><div id="overlay"><div class="overlay-card">Загрузка…</div></div><script>const id={{ poll_id|tojson }};async function load(){const r=await fetch('/api/poll/'+id);const p=await r.json();if(!r.ok){document.getElementById('overlay').textContent=p.error;return}const t=p.total||0;document.getElementById('overlay').innerHTML='<div class="overlay-card"><div class="eyebrow">'+(p.mode==='timed'?'⏱️ ОПРОС':'🗳️ ГОЛОСОВАНИЕ')+'</div><h2>'+esc(p.title)+'</h2>'+p.options.map(o=>'<div class="bar"><div class="bar-top"><span>'+esc(o.text)+'</span><b>'+Math.round(t?o.votes/t*100:0)+'%</b></div><div class="track"><i style="width:'+Math.round(t?o.votes/t*100:0)+'%"></i></div></div>').join('')+(p.mode==='timed'?'<div class="overlay-time">'+fmt(p.remaining)+'</div>':'')+'</div>'}function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}function fmt(s){s=Math.max(0,s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}load();setInterval(load,1000);</script></body></html>
