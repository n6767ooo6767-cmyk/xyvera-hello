<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XYVERA Timer Overlay</title><style>html,body{margin:0;background:transparent}.timer{font:800 90px/1 system-ui,sans-serif;color:white;text-shadow:0 4px 18px #000;padding:20px}.done{opacity:.55}</style></head><body><div id="time" class="timer">05:00</div><script>const id={{timer_id|tojson}};async function load(){const r=await fetch('/api/timer/'+id);const t=await r.json();if(!r.ok){document.getElementById('time').textContent=t.error;return}const el=document.getElementById('time');el.textContent=fmt(t.remaining);el.classList.toggle('done',t.remaining===0)}function fmt(s){s=Math.max(0,s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}load();setInterval(load,500)}</script></body></html>
