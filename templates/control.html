<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Управление — XYVERA</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap narrow"><a href="/" class="back">← XYVERA</a><div id="control">Загрузка…</div></main><script>const id={{ poll_id|tojson }};async function load(){const r=await fetch('/api/poll/'+id);const p=await r.json();if(!r.ok){document.getElementById('control').textContent=p.error;return}document.getElementById('control').innerHTML='<p class="eyebrow">CONTROL PANEL</p><h1>'+esc(p.title)+'</h1><div class="links"><a class="button" href="/p/'+id+'" target="_blank">Страница зрителей</a><a class="button" href="/p/'+id+'/overlay" target="_blank">OBS Overlay</a></div><div class="result"><b>'+p.total+' голосов</b>'+p.options.map(o=>'<div class="result-row"><span>'+esc(o.text)+'</span><span>'+o.votes+'</span></div>').join('')+'</div><button class="button danger" onclick="closePoll()" '+(p.closed?'disabled':'')+'>Завершить опрос</button>'}async function closePoll(){await fetch('/api/poll/'+id+'/close',{method:'POST'});load()}function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}load();setInterval(load,2000);</script></body></html>
